<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특강 관리 | CMS 서초영재관</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo_master.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/common.css">
<style id="noticeCss"></style>
<style>
  body{background:#F4F4F7;}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login .card{width:100%;max-width:400px;padding:36px;}
  .login img{height:30px;margin-bottom:22px;}
  .login h1{font-size:22px;margin:0 0 6px;}
  .login p{color:var(--muted);margin:0 0 22px;font-size:14px;}
  .login .field{margin-bottom:12px;}
  .login .err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0;}

  /* app shell */
  .head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .head-in{max-width:1600px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px;}
  .head img{height:22px;}
  .head .t{font-weight:800;font-size:16px;}
  .head .sp{flex:1;}
  .head .who{font-size:12.5px;color:var(--muted);}
  .tabs{max-width:1600px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;}
  .tabs button{border:0;background:transparent;height:46px;padding:0 16px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--charcoal);}
  .tabs button .c{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--line-2);font-size:11.5px;color:var(--ink-2);}
  .main{max-width:1600px;margin:0 auto;padding:22px 20px 80px;}
  .panel{display:none;}
  .panel.on{display:block;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .bar .sp{flex:1;}
  .bar .input{height:40px;width:auto;}
  .search{min-width:220px;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px;}
  .stat b{display:block;font-size:22px;letter-spacing:-0.02em;}
  .stat span{font-size:12px;color:var(--muted);font-weight:600;}
  .banner{background:var(--red-p);color:var(--red);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;display:none;}
  .banner.show{display:block;}
  .infobox{background:var(--amber-p);color:#8A5300;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;}
  .infobox ul{margin:6px 0 0;padding-left:18px;}

  /* roster columns */
  .hall-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:17px;font-weight:800;}
  .hall-h img{height:22px;}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start;}
  .col{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .col.dim{opacity:.35;}
  .col-h{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);}
  .col-h .no{flex:none;width:24px;height:24px;border-radius:7px;background:var(--charcoal);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .col.premium .col-h .no{background:var(--blue);}
  .col.gifted .col-h .no{background:var(--green);}
  .col-h .tt{font-weight:800;font-size:14.5px;line-height:1.35;}
  .col-h .tt small{display:block;font-weight:600;color:var(--muted);font-size:12px;}
  .col-h .btn{margin-left:auto;flex:none;}
  .col-meta{display:grid;grid-template-columns:52px 1fr 52px 1fr;font-size:12px;border-bottom:1px solid var(--line-2);}
  .col-meta > div{padding:5px 8px;border-bottom:1px solid var(--line-2);}
  .col-meta .k{color:var(--muted);font-weight:700;background:#FBFBFC;}
  .col-stat{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line);}
  .col-stat b{font-size:15px;}
  .col-stat .meter{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;}
  .col-stat .meter i{display:block;height:100%;background:var(--green);}
  .col-stat .meter i.full{background:var(--red);}
  .rt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  .rt td{padding:6px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rt td.n{width:26px;color:var(--muted);text-align:center;font-size:11.5px;}
  .rt td.nm{width:30%;font-weight:700;cursor:pointer;}
  .rt td.nm:hover{color:var(--green-d);text-decoration:underline;}
  .rt td.sc{color:var(--ink-2);font-size:12px;}
  .rt td.rc{color:var(--ink-2);font-size:12px;}
  .rt td.ox{width:34px;text-align:center;}
  .rt td.mm{width:58px;text-align:right;}
  .rt tr.x td.nm,.rt tr.x td.sc,.rt tr.x td.rc{text-decoration:line-through;color:#B8B8BE;}
  .rt tr.hit td{background:#FFF7D6;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle;background:var(--blue);}
  .dot.in{background:var(--green);}
  .oxb{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12px;cursor:pointer;color:var(--green-d);}
  .oxb.x{color:var(--red);background:var(--red-p);border-color:#f3c2c4;}
  .memo-tag{display:inline-block;max-width:56px;overflow:hidden;text-overflow:ellipsis;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;vertical-align:middle;}
  .dup{background:var(--amber);color:#fff;font-size:10px;border-radius:4px;padding:0 4px;margin-left:4px;}
  .col-add{padding:8px 10px;}
  .col-add input{width:100%;height:32px;border:1px dashed var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:#FCFCFD;}
  .col-add input:focus{outline:none;border-color:var(--green);border-style:solid;background:#fff;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;}
  .search-res{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;display:none;}
  .search-res.show{display:block;}
  .search-res .sr{padding:6px 0;border-bottom:1px solid var(--line-2);}
  .search-res .sr:last-child{border-bottom:0;}

  /* winter */
  .wcols{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;}
  .wcol{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:240px;}
  .wcol-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--charcoal);color:#fff;font-weight:800;}
  .wcol-h span{font-size:12.5px;font-weight:600;opacity:.85;}
  .wt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  .wt td{padding:6px;border-bottom:1px solid var(--line-2);vertical-align:top;}
  .wt td.n{width:24px;color:var(--muted);text-align:center;font-size:11px;}
  .wt td.nm{font-weight:700;cursor:pointer;width:44%;}
  .wt td.nm small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
  .wt td.pd{color:var(--ink-2);font-size:11.5px;line-height:1.4;}
  .wt td.en{width:44px;text-align:right;}
  .wt tr.x td{text-decoration:line-through;color:#B8B8BE;}
  .wt tr.hit td{background:#FFF7D6;}

  /* tables generic */
  .dt{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
  .dt th{background:var(--bg);text-align:left;padding:10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
  .dt td{padding:9px 10px;border-bottom:1px solid var(--line-2);}
  .dt-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff;}

  /* courses manage */
  .cm-cat{margin:22px 0 10px;font-weight:800;font-size:16px;}
  .cm-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .cm-row.dragging{opacity:.4;}
  .cm-row.over{box-shadow:0 0 0 2px var(--green);}
  .cm-row .hd{cursor:grab;color:var(--muted);font-size:18px;user-select:none;}
  .cm-row .ti{font-weight:800;}
  .cm-row .vs{font-size:12.5px;color:var(--muted);}
  .cm-row .ac{margin-left:auto;display:flex;gap:6px;}

  /* form grid in modals */
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .fg .full{grid-column:1/-1;}
  .modal h2{margin:0 0 18px;font-size:21px;}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;}
  .modal .acts .left{margin-right:auto;}
  .ved{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg);}
  .ved .fg{grid-template-columns:repeat(4,1fr);}
  .ved .rm{float:right;}
  .daypick{display:flex;gap:4px;flex-wrap:wrap;}
  .daypick label{display:inline-flex;align-items:center;justify-content:center;width:34px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;}
  .daypick input{display:none;}
  .daypick label:has(input:checked){background:var(--charcoal);color:#fff;border-color:var(--charcoal);}
  .mini-h{font-size:13px;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:8px;}

  /* notices */
  .nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .ncard{padding:18px;display:flex;flex-direction:column;gap:8px;}
  .ncard .nt1{font-weight:800;font-size:16px;}
  .ncard .nt2{font-size:12.5px;color:var(--muted);}
  .ncard .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .editor{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:18px;align-items:start;}
  .ed-form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:120px;}
  .ed-form .sec{border-bottom:1px dashed var(--line);padding-bottom:16px;margin-bottom:16px;}
  .ed-form .sec:last-child{border-bottom:0;}
  .ed-form .sec > b{display:block;margin-bottom:10px;font-size:14px;}
  .ed-form .field{margin-bottom:10px;}
  .ed-prev{background:#E9E9EE;border-radius:16px;padding:20px;min-height:400px;}
  .ed-prev .nt{box-shadow:var(--shadow);border-radius:6px;}
  .impbox{border:1.5px solid #F2C94C;background:#FFF9E6;border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13.5px;}
  .impbox.ok{border-color:var(--green);background:var(--green-p);}
  .impbox h4{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .impbox ul{margin:4px 0 0;padding-left:20px;}
  .impbox li{margin:3px 0;}
  .impbox .inf{color:#55555A;}
  .impbox .x{margin-left:auto;}
  .linkbox{display:flex;gap:6px;align-items:center;background:var(--green-p);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;flex-wrap:wrap;}
  .linkbox code{flex:1;min-width:200px;word-break:break-all;font-size:12px;}
  .rowed{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg);}
  .rowed .fg{gap:8px;}

  /* archive cards */
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .acard{padding:18px;display:flex;flex-direction:column;gap:6px;}
  .acard h3{margin:0;font-size:16px;}
  .acard .t2{font-size:12.5px;color:var(--ink-2);}
  .acard .ac{display:flex;gap:6px;margin-top:auto;padding-top:8px;}
  .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px;}
  .tl div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;}
  .tl b{color:var(--green-d);font-size:12px;display:block;}

  .set-card{padding:22px;margin-bottom:14px;max-width:820px;}
  .set-card h3{margin:0 0 14px;font-size:16px;}

  @media (max-width:1100px){ .editor{grid-template-columns:1fr;} .ed-form{position:static;max-height:none;} }
  @media (max-width:640px){
    .main{padding:16px 12px 60px;}
    .head-in{padding:0 12px;}
    .head .who{display:none;}
    .cols{grid-template-columns:1fr;}
    .fg,.ved .fg{grid-template-columns:1fr 1fr;}
    .search{min-width:0;flex:1;}
  }
  @media print{
    .head,.tabs,.bar,.no-print,.col-add,.search-res{display:none !important;}
    body{background:#fff;}
    .main{padding:0;max-width:none;}
    .col,.wcol{break-inside:avoid;}
    .cols{grid-template-columns:repeat(3,1fr);}
    .wcols{grid-template-columns:repeat(5,1fr);}
    .ed-form{display:none;}
    .ed-prev{background:#fff;padding:0;}
  }
</style>
</head>
<body>

<!-- ============ 로그인 ============ -->
<div class="login" id="loginView" style="display:none">
  <form class="card" id="loginForm">
    <img src="assets/logo_master.png" alt="CMS">
    <h1>특강 관리자</h1>
    <p>강사 · 관리자 계정으로 로그인하세요.</p>
    <div class="field"><label for="email">이메일</label><input class="input" id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">비밀번호</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-dark btn-block" style="height:48px" type="submit">로그인</button>
    <a href="index.html" class="hint" style="display:block;text-align:center;margin-top:14px">← 신청페이지로</a>
  </form>
</div>

<!-- ============ 관리 화면 ============ -->
<div id="appView" style="display:none">
  <header class="head">
    <div class="head-in">
      <img src="assets/logo_master.png" alt="CMS">
      <span class="t">방학특강 관리</span>
      <span class="badge green" id="seasonBadge"></span>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <a class="btn btn-sm" href="index.html" target="_blank">신청페이지 ↗</a>
      <button class="btn btn-sm btn-ghost" id="logoutBtn">로그아웃</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="roster" class="on">특강 명단 <span class="c" id="cRoster">0</span></button>
      <button data-tab="winter">윈터스쿨 명단 <span class="c" id="cWinter">0</span></button>
      <button data-tab="notices">반별 안내문 <span class="c" id="cNotice">0</span></button>
      <button data-tab="courses">강좌 관리</button>
      <button data-tab="archive">지난 특강</button>
      <button data-tab="settings">설정</button>
    </nav>
  </header>

  <main class="main">
    <div class="banner" id="banner"></div>

    <!-- 특강 명단 -->
    <section class="panel on" id="p-roster">
      <div class="bar">
        <select class="input" id="rSeason"></select>
        <div class="seg" id="rHall"><button data-h="all" class="on">전체</button><button data-h="gifted">영재관</button><button data-h="premium">프리미엄관</button></div>
        <input class="input search" id="rSearch" placeholder="학생 이름 검색">
        <span class="sp"></span>
        <button class="btn btn-sm" id="rCsv">CSV 다운로드</button>
        <a class="btn btn-sm" id="rSheet" target="_blank">구글시트 ↗</a>
        <button class="btn btn-sm" onclick="window.print()">인쇄</button>
      </div>
      <div class="stats" id="rStats"></div>
      <div class="search-res" id="rSearchRes"></div>
      <div class="legend no-print"><span><i class="dot in"></i> 재원생</span><span><i class="dot"></i> 외부생</span><span><b style="color:var(--green-d)">O</b> 수강 · <b style="color:var(--red)">X</b> 취소(이름 유지)</span><span>이름 클릭 → 상세/수정 · 칸 아래에 이름 입력 후 Enter → 바로 추가</span></div>
      <div id="rosterRoot"></div>
    </section>

    <!-- 윈터스쿨 -->
    <section class="panel" id="p-winter">
      <div class="bar">
        <select class="input" id="wSeason"></select>
        <input class="input search" id="wSearch" placeholder="학생 이름 검색">
        <span class="sp"></span>
        <button class="btn btn-sm btn-dark" id="wAdd">＋ 학생 추가</button>
        <button class="btn btn-sm" id="wCsv">CSV 다운로드</button>
        <button class="btn btn-sm" onclick="window.print()">인쇄</button>
      </div>
      <div class="stats" id="wStats"></div>
      <div class="hint no-print" id="wInfo" style="margin-bottom:10px"></div>
      <div class="wcols" id="wCols"></div>
      <div class="mini-h" style="margin-top:26px">전체 신청자</div>
      <div class="dt-wrap"><table class="dt" id="wTable"></table></div>
    </section>

    <!-- 반별 안내문 -->
    <section class="panel" id="p-notices">
      <div id="nListView">
        <div class="bar">
          <div><b style="font-size:17px">반별 겨울방학 학습 계획 안내문</b><div class="hint">각 반 담당 선생님이 반별 안내문을 만들고, 링크를 학부모님께 발송합니다. 안내문에서 바로 특강 신청으로 연결됩니다.</div></div>
          <span class="sp"></span>
          <button class="btn btn-green" id="nImport">한글 파일로 만들기</button>
          <button class="btn btn-dark" id="nNew">＋ 새 안내문</button>
        </div>
        <input type="file" id="nFile" accept=".hwp,.hwpx" hidden>
        <div class="nlist" id="nList"></div>
      </div>
      <div id="nEditView" style="display:none">
        <div class="bar">
          <button class="btn btn-sm" id="nBack">← 목록</button>
          <b id="nEditTitle" style="font-size:16px"></b>
          <span class="sp"></span>
          <button class="btn btn-sm btn-green" id="nImport2">한글 파일 불러오기</button>
          <button class="btn btn-sm" id="nSample">예시 불러오기</button>
          <button class="btn btn-sm" id="nPrint">인쇄 / PDF</button>
          <button class="btn btn-sm btn-green" id="nSave">저장</button>
        </div>
        <div id="nLinkBox"></div>
        <div id="nImportBox"></div>
        <div class="editor">
          <div class="ed-form" id="nForm"></div>
          <div class="ed-prev" id="nPreview"></div>
        </div>
      </div>
    </section>

    <!-- 강좌 관리 -->
    <section class="panel" id="p-courses">
      <div class="bar">
        <select class="input" id="cSeason"></select>
        <span class="sp"></span>
        <button class="btn btn-sm" id="cOrderSave" style="display:none">순서 저장</button>
        <button class="btn btn-sm" id="cSeed">겨울 초기 강좌 업로드</button>
        <button class="btn btn-sm btn-dark" id="cAdd">＋ 강좌 추가</button>
      </div>
      <div id="cInfo"></div>
      <div id="cList"></div>
    </section>

    <!-- 지난 특강 -->
    <section class="panel" id="p-archive">
      <div class="bar">
        <select class="input" id="aSeason"></select>
        <div class="hint">지난 시즌 특강을 참고해서 이번 시즌 강좌를 개설할 수 있습니다. 외부에는 공개되지 않습니다.</div>
      </div>
      <div class="stats" id="aStats"></div>
      <div id="aList"></div>
    </section>

    <!-- 설정 -->
    <section class="panel" id="p-settings">
      <div id="sForm"></div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script type="module">
import {
  collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut

    ? `<b>${what}</b> 데이터를 읽을 권한이 없습니다. Firebase 콘솔에서 <b>Firestore 보안규칙</b>을 「설정파일/Firestore_보안규칙.txt」 내용으로 업데이트해주세요.`
    : `<b>${what}</b> 데이터를 불러오지 못했습니다: ${esc(err.message)}`;
};
function subscribe() {

    refresh();

  unsubs.push(onSnapshot(collection(db, "applications"), (s) => {
    APPS = s.docs.map((d) => ({ ...d.data(), id: d.id }));
    refresh();
  }, permErr("특강 신청")));
  unsubs.push(onSnapshot(collection(db, "winterSchool"), (s) => {
    WINTER = s.docs.map((d) => ({ ...d.data(), id: d.id }));
    refresh();
  }, permErr("윈터스쿨")));
  unsubs.push(onSnapshot(collection(db, "notices"), (s) => {

/* ================= 공통 ================= */
const tsOf = (a) => (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt && a.createdAt.seconds ? a.createdAt.seconds * 1000 : Date.parse(a.timestamp) || 0));
const fmtTs = (a) => { const t = tsOf(a); return t ? new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : (a.timestamp || ""); };
const isCancel = (a) => a.status === "cancel";
function seasons() {
  const s = new Set([SEASON, LEGACY_SEASON]);
  [...COURSES, ...APPS, ...WINTER].forEach((x) => s.add(seasonOf(x)));
  return [...s].sort().reverse();
}
function fillSeasonSelect(sel, value, exclude) {
  const list = seasons().filter((s) => s !== exclude);
  sel.innerHTML = list.map((s) => `<option value="${esc(s)}" ${s === value ? "selected" : ""}>${esc(seasonName(s))}${s === SEASON ? " (현재)" : ""}</option>`).join("");
}
function openModal(html, wide = false) {
  $("#modal").className = `modal ${wide ? "wide" : ""}`;
  $("#modal").innerHTML = `<button class="modal-close" data-close>✕</button>${html}`;
  $$("[data-close]", $("#modal")).forEach((b) => b.onclick = closeModal);
  $("#overlay").classList.add("open"); document.body.style.overflow = "hidden"; $("#overlay").scrollTop = 0;
}
function closeModal() { $("#overlay").classList.remove("open"); document.body.style.overflow = ""; }
$("#overlay").addEventListener("mousedown", (e) => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function downloadCSV(name, rows) {
  const csv = "﻿" + rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= 1. 특강 명단 ================= */
function buildColumns(season) {
  const list = COURSES.filter((c) => seasonOf(c) === season);
  const cols = [];
  const counters = {};
  list.forEach((c) => {
    const h = hallOf(c.category).id;
    counters[h] = (counters[h] || 0) + 1;
    (c.variants || [{}]).forEach((v, vi) => cols.push({ key: `${c.id}#${vi}`, c, v, vi, no: counters[h], hall: h, apps: [] }));
  });
  const byKey = Object.fromEntries(cols.map((x) => [x.key, x]));
  const byLabel = {};
  cols.forEach((x) => { byLabel[variantLabel(x.c, x.vi)] = x; byLabel[legacyCourseLabel(x.c, x.v)] = x; });
  const orphan = { key: "orphan", c: { title: "미배정 신청", category: "", variants: [] }, v: {}, vi: 0, no: "?", hall: "etc", apps: [] };
  APPS.filter((a) => seasonOf(a) === season).forEach((a) => {
    const col = byKey[a.courseKey] || byLabel[a.course] || orphan;
    col.apps.push(a);
  });
  cols.forEach((x) => x.apps.sort((a, b) => tsOf(a) - tsOf(b)));
  orphan.apps.sort((a, b) => tsOf(a) - tsOf(b));
  return { cols, orphan };
}

function renderRoster() {
  const season = ui.rSeason;
  const { cols, orphan } = buildColumns(season);
  const term = ui.rSearch.trim();
  const seasonApps = APPS.filter((a) => seasonOf(a) === season);
  const active = seasonApps.filter((a) => !isCancel(a));
  const students = new Set(active.map((a) => `${a.studentName}|${a.phone || ""}`));
  $("#rStats").innerHTML = `
    <div class="stat"><b>${active.length}</b><span>수강 신청</span></div>
    <div class="stat"><b>${students.size}</b><span>학생 수</span></div>
    <div class="stat"><b>${seasonApps.length - active.length}</b><span>취소</span></div>
    <div class="stat"><b>${active.filter((a) => a.enrolled === "외부생").length}</b><span>외부생</span></div>
    <div class="stat"><b>${cols.length}</b><span>개설 반</span></div>`;
  $("#rSheet").href = SHEET_URL;

  // 검색 결과
  const sr = $("#rSearchRes");
  if (term) {
    const names = [...new Set(seasonApps.filter((a) => (a.studentName || "").includes(term)).map((a) => a.studentName))];
    const wNames = WINTER.filter((w) => seasonOf(w) === season && (w.studentName || "").includes(term));
    const all = [...new Set([...names, ...wNames.map((w) => w.studentName)])];
    sr.classList.add("show");
    sr.innerHTML = all.length ? all.map((n) => {
      const mine = seasonApps.filter((a) => a.studentName === n);
      const w = wNames.filter((x) => x.studentName === n);
      return `<div class="sr"><b>${esc(n)}</b> — ${mine.map((a) => `${esc(a.course)}${isCancel(a) ? " <span class='badge red'>취소</span>" : ""}`).join(", ") || "특강 없음"}${w.length ? ` · <span class="badge dark">윈터스쿨 ${esc((w[0].days || []).join(""))}</span>` : ""}</div>`;
    }).join("") : `<div class="sr">‘${esc(term)}’ 학생이 없습니다.</div>`;
  } else sr.classList.remove("show");

  const root = $("#rosterRoot");
  if (!cols.length && !orphan.apps.length) {
    root.innerHTML = `<div class="empty">${esc(seasonName(season))} 강좌가 없습니다. [강좌 관리]에서 강좌를 등록해주세요.</div>`;
    return;
  }
  const halls = HALLS.filter((h) => ui.rHall === "all" || ui.rHall === h.id);
  let html = halls.map((h) => {
    const hc = cols.filter((x) => x.hall === h.id);
    if (!hc.length) return "";
    return `<div class="hall-h"><img src="${h.logo}" alt="">${h.name} <span class="hint">${hc.length}개 반 · ${hc.reduce((s, x) => s + x.apps.filter((a) => !isCancel(a)).length, 0)}명</span></div>
      <div class="cols">${hc.map((x) => colHtml(x, term)).join("")}</div>`;
  }).join("");
  if (orphan.apps.length) html += `<div class="hall-h">미배정 <span class="hint">강좌가 삭제되었거나 이름이 바뀐 신청</span></div><div class="cols">${colHtml(orphan, term)}</div>`;
  root.innerHTML = html;

  $$("[data-app]", root).forEach((el) => el.onclick = () => editApp(el.dataset.app));
  $$("[data-ox]", root).forEach((el) => el.onclick = async () => {
    const a = APPS.find((x) => x.id === el.dataset.ox);
    await updateDoc(doc(db, "applications", a.id), { status: isCancel(a) ? "active" : "cancel" });
  });
  $$("[data-colmeta]", root).forEach((el) => el.onclick = () => editColMeta(el.dataset.colmeta));
  $$("[data-quick]", root).forEach((inp) => inp.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    const name = inp.value.trim(); if (!name) return;
    const x = cols.find((c) => c.key === inp.dataset.quick);
    inp.value = "";
    await addDoc(collection(db, "applications"), {
      season, courseId: x.c.id, variantIdx: x.vi, courseKey: x.key, course: variantLabel(x.c, x.vi), category: x.c.category,
      variantLabel: x.v.label || "", studentName: name, school: "", grade: "", phone: "", enrolled: "재원생", regularClass: "",
      status: "active", staffMemo: "", memo: "", source: "staff", createdAt: serverTimestamp(), timestamp: new Date().toLocaleString("ko-KR")
    });
    toast(`${name} 학생을 추가했습니다.`, "ok");
  }));
}

function colHtml(x, term) {
  const v = x.v || {};
  const act = x.apps.filter((a) => !isCancel(a)).length;
  const cancel = x.apps.length - act;
  const cap = +v.capacity || 0;
  const hit = term && x.apps.some((a) => (a.studentName || "").includes(term));
  const dupKey = {};
  x.apps.forEach((a) => { const k = `${a.studentName}|${a.phone}`; dupKey[k] = (dupKey[k] || 0) + 1; });
  return `<div class="col ${x.hall} ${term && !hit ? "dim" : ""}">
    <div class="col-h"><span class="no">${x.no}</span><div class="tt">${esc(x.c.title)}${(x.c.variants || []).length > 1 || v.label ? `<small>${esc(v.label || "")}</small>` : ""}</div>
      ${x.key !== "orphan" ? `<button class="btn btn-xs btn-ghost no-print" data-colmeta="${x.key}" title="담당/강의실/정원">⋯</button>` : ""}</div>
    ${x.key !== "orphan" ? `<div class="col-meta">
      <div class="k">요일</div><div>${esc(v.days ? v.days.join("") : (v.label || ""))}</div><div class="k">회차</div><div>${v.count ? v.count + "회" : esc(v.time || "-")}</div>
      <div class="k">시간</div><div>${esc(v.days ? v.time : "") || "-"}</div><div class="k">개강</div><div>${esc(variantPeriod(v).split(" ~")[0] || "-")}</div>
      <div class="k">담당</div><div>${esc(v.teacher || "-")}</div><div class="k">강의실</div><div>${esc(v.room || "-")}</div>
    </div>` : ""}
    <div class="col-stat">수강 <b>${act}</b>${cap ? ` / ${cap}` : ""}<span class="meter"><i class="${cap && act >= cap ? "full" : ""}" style="width:${cap ? Math.min(100, act / cap * 100) : (act ? 100 : 0)}%"></i></span>취소 ${cancel}${v.closed ? ` <span class="badge red">마감</span>` : ""}</div>
    <table class="rt"><tbody>
      ${x.apps.map((a, i) => `<tr class="${isCancel(a) ? "x" : ""} ${term && (a.studentName || "").includes(term) ? "hit" : ""}">
        <td class="n">${i + 1}</td>
        <td class="nm" data-app="${a.id}" title="${esc(a.studentName)}">${esc(a.studentName)}<i class="dot ${a.enrolled === "재원생" ? "in" : ""}"></i>${dupKey[`${a.studentName}|${a.phone}`] > 1 ? `<span class="dup">중복</span>` : ""}</td>
        <td class="sc" title="${esc(a.school)} ${esc(a.grade)}">${esc(a.school || "")} ${esc(a.grade || "")}</td>
        <td class="rc" title="${esc(a.regularClass || a.enrolled || "")}">${esc(a.regularClass || (a.enrolled === "외부생" ? "외부생" : ""))}</td>
        <td class="ox"><button class="oxb ${isCancel(a) ? "x" : ""}" data-ox="${a.id}" title="수강/취소 전환">${isCancel(a) ? "X" : "O"}</button></td>
        <td class="mm">${a.staffMemo ? `<span class="memo-tag" title="${esc(a.staffMemo)}">${esc(a.staffMemo)}</span>` : (a.memo ? `<span class="badge amber" title="${esc(a.memo)}">요청</span>` : "")}</td>
      </tr>`).join("") || `<tr><td colspan="6" class="hint" style="text-align:center;padding:14px">신청자가 없습니다</td></tr>`}
    </tbody></table>
    ${x.key !== "orphan" ? `<div class="col-add"><input data-quick="${x.key}" placeholder="＋ 학생 이름 입력 후 Enter"></div>` : ""}
  </div>`;
}

function courseOptions(season, selKey) {
  const { cols } = buildColumns(season);
  return cols.map((x) => `<option value="${x.key}" ${x.key === selKey ? "selected" : ""}>[${esc(x.c.category)}] ${esc(variantLabel(x.c, x.vi))}</option>`).join("");
}

function editApp(id) {
  const a = APPS.find((x) => x.id === id);
  if (!a) return;
  const season = seasonOf(a);
  const { cols } = buildColumns(season);
  const cur = cols.find((x) => x.apps.includes(a));
  openModal(`
    <h2>신청 정보 <span class="badge ${isCancel(a) ? "red" : "green"}">${isCancel(a) ? "취소" : "수강"}</span></h2>
    <div class="fg">
      <div class="field"><label>학생 이름</label><input class="input" id="eName" value="${esc(a.studentName)}"></div>
      <div class="field"><label>학교</label><input class="input" id="eSchool" value="${esc(a.school || "")}"></div>
      <div class="field"><label>학년</label><select class="input" id="eGrade"><option value=""></option>${GRADES.map((g) => `<option ${g === a.grade ? "selected" : ""}>${g}</option>`).join("")}</select></div>
      <div class="field"><label>학부모 연락처</label><input class="input" id="ePhone" value="${esc(a.phone || "")}"></div>
      <div class="field"><label>재원 여부</label><select class="input" id="eEnr">${["재원생", "외부생"].map((v) => `<option ${v === a.enrolled ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>정규반</label><input class="input" id="eReg" value="${esc(a.regularClass || "")}" placeholder="예: [GS05]공수1상_월금"></div>
      <div class="field full"><label>특강 (반 이동)</label><select class="input" id="eCourse">${courseOptions(season, cur ? cur.key : "")}${!cur ? `<option value="" selected>미배정: ${esc(a.course || "")}</option>` : ""}</select></div>
      <div class="field"><label>상태</label><select class="input" id="eStatus"><option value="active">O 수강</option><option value="cancel" ${isCancel(a) ? "selected" : ""}>X 취소</option></select></div>
      <div class="field"><label>회차수강 / 관리 메모</label><input class="input" id="eMemo" value="${esc(a.staffMemo || "")}" placeholder="예: 1~6회, 2,3,5회"></div>
      <div class="field full"><label>학부모 요청사항</label><textarea class="input" id="eReq" rows="2">${esc(a.memo || "")}</textarea></div>
    </div>
    <p class="hint">신청: ${esc(fmtTs(a))} · ${a.source === "staff" ? "관리자 직접 추가" : "웹 신청"}</p>
    <div class="acts"><button class="btn btn-danger left" id="eDel">삭제</button><button class="btn" data-close>닫기</button><button class="btn btn-dark" id="eSave">저장</button></div>`);
  attachPhone($("#ePhone"));
  $("#eSave").onclick = async () => {
    const key = $("#eCourse").value;
    const col = cols.find((x) => x.key === key);
    const upd = {
      studentName: $("#eName").value.trim(), school: $("#eSchool").value.trim(), grade: $("#eGrade").value,
      phone: $("#ePhone").value.trim(), enrolled: $("#eEnr").value, regularClass: $("#eReg").value.trim(),
      status: $("#eStatus").value, staffMemo: $("#eMemo").value.trim(), memo: $("#eReq").value.trim()
    };
    if (col) Object.assign(upd, { courseId: col.c.id, variantIdx: col.vi, courseKey: col.key, course: variantLabel(col.c, col.vi), category: col.c.category, variantLabel: col.v.label || "" });
    await updateDoc(doc(db, "applications", a.id), upd);
    closeModal(); toast("저장했습니다.", "ok");
  };
  $("#eDel").onclick = async () => {
    if (!confirm(`${a.studentName} 학생의 '${a.course}' 신청을 완전히 삭제할까요?\n(수강 취소는 상태를 X로 바꾸면 이름이 남습니다)`)) return;
    await deleteDoc(doc(db, "applications", a.id)); closeModal(); toast("삭제했습니다.");
  };
}
function attachPhone(inp) { inp.addEventListener("input", (e) => e.target.value = formatPhone(e.target.value)); }

function editColMeta(key) {
  const [cid, viS] = key.split("#"); const vi = +viS;
  const c = COURSES.find((x) => x.id === cid); if (!c) return;
  const v = (c.variants || [])[vi] || {};
  openModal(`<h2>${esc(variantLabel(c, vi))}</h2>
    <div class="fg">
      <div class="field"><label>담당 선생님</label><input class="input" id="mT" value="${esc(v.teacher || "")}"></div>
      <div class="field"><label>강의실</label><input class="input" id="mR" value="${esc(v.room || "")}"></div>
      <div class="field"><label>정원 (0 = 제한 없음)</label><input class="input" id="mC" type="number" min="0" value="${+v.capacity || 0}"></div>
      <div class="field"><label>신청 마감</label><label class="pill-check" style="width:max-content"><input type="checkbox" id="mX" ${v.closed ? "checked" : ""}>신청페이지에서 마감 표시</label></div>
    </div>
    <div class="acts"><button class="btn" data-close>닫기</button><button class="btn btn-dark" id="mSave">저장</button></div>`);
  $("#mSave").onclick = async () => {
    const variants = (c.variants || []).map((x, i) => i === vi ? { ...x, teacher: $("#mT").value.trim(), room: $("#mR").value.trim(), capacity: +$("#mC").value || 0, closed: $("#mX").checked } : x);
    await updateDoc(doc(db, "courses", c.id), { variants });
    closeModal(); toast("저장했습니다.", "ok");
  };
}

    if (!confirm(`'${c.title}' 강좌를 삭제할까요?${n ? `\n이 강좌 신청 ${n}건은 '미배정'으로 이동합니다.` : ""}`)) return;
    await deleteDoc(doc(db, "courses", c.id)); toast("삭제했습니다.");
  });
  initDrag();
}
function initDrag() {
  let dragEl = null;
  $$(".cm-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragEl = row; row.classList.add("dragging"); });
    row.addEventListener("dragend", () => { row.classList.remove("dragging"); $$(".cm-row").forEach((r) => r.classList.remove("over")); });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!dragEl || dragEl === row || dragEl.parentNode !== row.parentNode) return;
      $$(".cm-row").forEach((r) => r.classList.remove("over")); row.classList.add("over");
      const rect = row.getBoundingClientRect();
      row.parentNode.insertBefore(dragEl, e.clientY < rect.top + rect.height / 2 ? row : row.nextSibling);
      pendingOrder = $$(".cm-row").map((r) => r.dataset.id);
      $("#cOrderSave").style.display = "";
    });
  });
}
$("#cOrderSave").onclick = async () => {
  if (!pendingOrder) return;
  const batch = writeBatch(db);
  pendingOrder.forEach((id, i) => batch.update(doc(db, "courses", id), { order: i }));
  await batch.commit();
  pendingOrder = null; $("#cOrderSave").style.display = "none"; toast("순서를 저장했습니다.", "ok");

    <div class="field" style="margin-top:8px"><label>휴강/특이사항 안내 문구</label><input class="input" id="kNote" value="${esc(c.note || "")}" placeholder="설 연휴 2/6(토) ~ 2/10(수) 기간은 휴강입니다."></div>
    <div class="mini-h">회차별 진도 <span class="hint">(한 줄에 1회차)</span></div>
    <textarea class="input" id="kSess" rows="8">${esc((c.sessions || []).join("\n"))}</textarea>
    <div class="acts"><button class="btn" data-close>취소</button><button class="btn btn-dark" id="kSave">저장</button></div>`, true);

  const readVariants = () => $$("#vWrap .ved").map((el, i) => {
    const get = (f) => $(`[data-f="${f}"]`, el);
    const prev = variants[+el.dataset.v] || {};
    return { ...prev, label: get("label").value.trim(), time: get("time").value.trim(), count: +get("count").value || 0, capacity: +get("capacity").value || 0,
      days: picked(`vd${el.dataset.v}`, el), start: get("start").value, end: get("end").value, period: get("period").value.trim(),
      teacher: get("teacher").value.trim(), room: get("room").value.trim(), closed: get("closed").checked };
  });
  const drawBreaks = () => {
    $("#bWrap").innerHTML = breaks.map((b, i) => `<div class="fg" style="grid-template-columns:1fr 1fr auto;margin-bottom:6px" data-b="${i}">
      <input class="input sm" type="date" value="${esc(b.from || "")}" data-bf="from"><input class="input sm" type="date" value="${esc(b.to || "")}" data-bf="to"><button class="btn btn-xs btn-danger" data-bdel="${i}">✕</button></div>`).join("") || `<div class="hint">없음</div>`;
    $$("[data-b]").forEach((row) => $$("[data-bf]", row).forEach((inp) => inp.oninput = () => { breaks[+row.dataset.b][inp.dataset.bf] = inp.value; checkV(); }));
    $$("[data-bdel]").forEach((b) => b.onclick = () => { breaks.splice(+b.dataset.bdel, 1); drawBreaks(); checkV(); });
  };
  const checkV = () => {
    const vs = readVariants();
    $$("#vWrap .ved").forEach((el, i) => {
      const r = computeSessions(vs[i], breaks.filter((b) => b.from));
      const box = $("[data-vcheck]", el);
      if (!r) { box.textContent = ""; return; }
      const last = r.dates[r.dates.length - 1];
      box.innerHTML = r.exact ? `✅ 요일·휴강 기준 ${r.dates.length}회 계산 → 종강일과 일치 (신청페이지에 회차별 날짜 표시)` :
        `⚠️ 계산된 ${r.dates.length}회차 마지막 날짜: ${last ? fmtMD(last) : "-"} — 종강일과 다릅니다. (회차별 날짜는 표시되지 않음)`;
    });
  };
  drawBreaks(); checkV();
  $("#vWrap").addEventListener("input", checkV); $("#vWrap").addEventListener("change", checkV);
  $("#bAdd").onclick = () => { breaks.push({ from: "", to: "" }); drawBreaks(); };
  $("#vAdd").onclick = () => { const cur = readVariants(); variants.splice(0, variants.length, ...cur, { label: "", days: [], time: "", count: 0 }); $("#vWrap").innerHTML = variants.map(vHtml).join(""); bindVdel(); checkV(); };
  const bindVdel = () => $$("[data-vdel]").forEach((b) => b.onclick = () => {
    const cur = readVariants(); if (cur.length <= 1) return toast("반은 최소 1개 필요합니다.", "err");
    cur.splice(+b.dataset.vdel, 1); variants.splice(0, variants.length, ...cur); $("#vWrap").innerHTML = variants.map(vHtml).join(""); bindVdel(); checkV();
  });
  bindVdel();
  $("#kSave").onclick = async () => {
    const data = {
      season: seasonOf(c), category: $("#kCat").value, title: $("#kTitle").value.trim(), subtitle: $("#kSub").value.trim(), textbook: $("#kBook").value.trim(),
      target: $("#kTarget").value.trim(), feature: $("#kFeat").value.trim(), variants: readVariants(), breaks: breaks.filter((b) => b.from),
      note: $("#kNote").value.trim(), sessions: $("#kSess").value.split("\n").map((s) => s.trim()).filter(Boolean)
    };
    if (!data.title) return toast("강좌명을 입력해주세요.", "err");
    if (isNew || !c.id) {
      data.order = COURSES.filter((x) => seasonOf(x) === data.season).length;
      await addDoc(collection(db, "courses"), data);
    } else await updateDoc(doc(db, "courses", c.id), data);
    closeModal(); toast("저장했습니다.", "ok");
  };
}

/* ================= 5. 지난 특강 ================= */
function renderArchive() {
  const season = ui.aSeason;
  const list = COURSES.filter((c) => seasonOf(c) === season);
  const { cols } = buildColumns(season);
  const apps = APPS.filter((a) => seasonOf(a) === season);
  $("#aStats").innerHTML = `<div class="stat"><b>${list.length}</b><span>특강</span></div><div class="stat"><b>${cols.length}</b><span>반</span></div><div class="stat"><b>${apps.filter((a) => !isCancel(a)).length}</b><span>신청</span></div>`;
  if (!list.length) { $("#aList").innerHTML = `<div class="empty card">${esc(seasonName(season))} 강좌 기록이 없습니다.</div>`; return; }
  $("#aList").innerHTML = CATEGORIES.map((cat) => {
    const cl = list.filter((c) => c.category === cat);
    if (!cl.length) return "";
    return `<div class="cm-cat">${cat}</div><div class="agrid">${cl.map((c) => {
      const n = cols.filter((x) => x.c.id === c.id).reduce((s, x) => s + x.apps.filter((a) => !isCancel(a)).length, 0);
      return `<div class="card acard">
        <div><span class="badge">${esc(c.category)}</span> <span class="badge green">신청 ${n}명</span></div>
        <h3>${esc(c.title)}</h3>
        <div class="t2">${esc(c.target || "")}</div>
        <div class="t2">${(c.variants || []).map((v) => `<b>${esc(v.label || "")}</b> ${esc(variantTime(v))} · ${esc(variantPeriod(v))}`).join("<br>")}</div>
        <div class="ac"><button class="btn btn-xs" data-adetail="${c.id}">자세히</button><button class="btn btn-xs btn-dark" data-acopy="${c.id}">이번 시즌으로 복사</button></div>
      </div>`;
    }).join("")}</div>`;
  }).join("");
  $$("[data-adetail]").forEach((b) => b.onclick = () => {
    const c = COURSES.find((x) => x.id === b.dataset.adetail);
    openModal(`<span class="badge">${esc(c.category)}</span> <span class="badge">${esc(seasonName(seasonOf(c)))}</span>
      <h2 style="margin-top:10px">${esc(c.title)}</h2>
      ${c.feature ? `<p style="background:var(--bg);padding:12px 14px;border-radius:12px">${nl2br(c.feature)}</p>` : ""}
      <table class="dt"><tr><th>교재</th><td>${esc(c.textbook || "-")}</td></tr><tr><th>대상</th><td>${nl2br(c.target || "-")}</td></tr>
      <tr><th>일정</th><td>${(c.variants || []).map((v) => `<b>${esc(v.label || "")}</b> ${esc(variantTime(v))} · ${esc(variantPeriod(v))}`).join("<br>")}</td></tr>
      ${c.note ? `<tr><th>비고</th><td>${esc(c.note)}</td></tr>` : ""}</table>
      ${(c.sessions || []).length ? `<div class="mini-h">회차별 진도</div><div class="tl">${c.sessions.map((s, i) => `<div><b>${i + 1}회</b>${esc(s)}</div>`).join("")}</div>` : ""}
      <div class="acts"><button class="btn" data-close>닫기</button><button class="btn btn-dark" id="aCopy2">이번 시즌으로 복사</button></div>`);
    $("#aCopy2").onclick = () => copyToSeason(c);
  });
  $$("[data-acopy]").forEach((b) => b.onclick = () => copyToSeason(COURSES.find((x) => x.id === b.dataset.acopy)));
}
function copyToSeason(c) {
  const { id, order, ...rest } = JSON.parse(JSON.stringify(c));
  rest.season = SEASON;
  rest.variants = (rest.variants || []).map((v) => ({ ...v, closed: false }));
  editCourse(rest, true);
  toast(`${SEASON_LABEL} 강좌로 복사합니다. 일정을 수정한 뒤 저장하세요.`);
}
$("#aSeason").onchange = (e) => { ui.aSeason = e.target.value; refresh(); };

/* ================= 6. 설정 ================= */
let settingsDirty = false;
function renderSettings() {
  const s = SETTINGS, w = s.winter;
  $("#sForm").innerHTML = `
    <div class="card set-card"><h3>신청 접수</h3>
      <label class="check"><input type="checkbox" id="sOpen" ${s.applyOpen ? "checked" : ""}> 신청페이지에서 신청서 받기 (끄면 '신청 마감' 표시)</label>
      <div class="field" style="margin-top:14px"><label>특강 안내 상단 공지</label><input class="input" id="sNote" value="${esc(s.heroNote || "")}"></div>
    </div>
    <div class="card set-card"><h3>윈터스쿨</h3>
      <label class="check" style="margin-bottom:12px"><input type="checkbox" id="sWOn" ${w.enabled ? "checked" : ""}> 윈터스쿨 운영 (신청서에 표시)</label>
      <div class="fg">
        <div class="field"><label>이름</label><input class="input" id="sWT" value="${esc(w.title)}"></div>
        <div class="field"><label>부제</label><input class="input" id="sWS" value="${esc(w.subtitle)}"></div>
        <div class="field"><label>시간</label><input class="input" id="sWTime" value="${esc(w.time)}"></div>
        <div class="field"><label>장소</label><input class="input" id="sWR" value="${esc(w.room || "")}" placeholder="예: 6강의실 / 9강의실"></div>
        <div class="field"><label>시작일</label><input class="input" type="date" id="sWA" value="${esc(w.start)}"></div>
        <div class="field"><label>종료일</label><input class="input" type="date" id="sWZ" value="${esc(w.end)}"></div>
        <div class="field"><label>휴무 시작</label><input class="input" type="date" id="sWBA" value="${esc((w.breaks || [])[0]?.from || "")}"></div>
        <div class="field"><label>휴무 끝</label><input class="input" type="date" id="sWBZ" value="${esc((w.breaks || [])[0]?.to || "")}"></div>
        <div class="field full"><label>소개 문구</label><textarea class="input" id="sWD" rows="3">${esc(w.desc)}</textarea></div>
      </div>
    </div>
    <div class="card set-card"><h3>바로가기</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-sm" href="index.html" target="_blank">신청페이지</a><a class="btn btn-sm" href="${SHEET_URL}" target="_blank">구글시트</a></div>
      <p class="hint">구글시트에는 웹 신청이 들어올 때마다 「${SEASON}_특강신청」, 「${SEASON}_윈터스쿨」 탭에 자동 기록됩니다. (관리자 화면에서 수정한 내용은 시트에 반영되지 않으니, 최종 명단은 CSV 다운로드를 이용하세요.)</p>
    </div>
    <button class="btn btn-dark" id="sSave">설정 저장</button>`;
  $("#sForm").oninput = () => { settingsDirty = true; };
  $("#sSave").onclick = async () => {
    const bA = $("#sWBA").value, bZ = $("#sWBZ").value;
    const data = {
      applyOpen: $("#sOpen").checked, heroNote: $("#sNote").value.trim(),
      winter: { enabled: $("#sWOn").checked, title: $("#sWT").value.trim(), subtitle: $("#sWS").value.trim(), time: $("#sWTime").value.trim(), room: $("#sWR").value.trim(),
        start: $("#sWA").value, end: $("#sWZ").value, breaks: bA ? [{ from: bA, to: bZ || bA }] : [], desc: $("#sWD").value.trim() }
    };
    await setDoc(doc(db, "settings", "site"), data, { merge: true });
    settingsDirty = false; toast("설정을 저장했습니다.", "ok");
  };
}
</script>
