<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>겨울방학 학습 계획 안내문 | CMS 서초영재관</title>
<meta property="og:title" content="CMS 서초영재관 겨울방학 학습 계획 안내문">
<meta property="og:description" content="우리 반 겨울방학 학습 계획과 특강 일정을 확인하세요.">
<meta property="og:image" content="assets/logo_slogan.png">
<link rel="icon" href="assets/logo_master.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/common.css">
<style id="noticeCss"></style>
<style>
  body{background:#EDEDF1;}
  .wrap{padding:28px 16px 60px;}
  .paper{max-width:820px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
  .tools{max-width:820px;margin:0 auto 12px;display:flex;justify-content:flex-end;gap:8px;}
  @media print{ body{background:#fff;} .wrap{padding:0;} .tools{display:none;} .paper{box-shadow:none;border-radius:0;} }
  @media (max-width:640px){ .wrap{padding:0 0 40px;} .paper{border-radius:0;} .tools{padding:10px 12px 0;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="tools"><button class="btn btn-sm" onclick="window.print()">인쇄 / PDF 저장</button></div>
  <div class="paper" id="paper"><div class="empty" style="background:#fff">안내문을 불러오는 중입니다…</div></div>
</div>
<script type="module">
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db } from "./js/common.js";
import { renderNotice, NOTICE_CSS, noticeTitle } from "./js/notice-render.js";

document.getElementById("noticeCss").textContent = NOTICE_CSS;
const paper = document.getElementById("paper");
const id = new URLSearchParams(location.search).get("id");

function applyUrl(n) {
  const keys = (n.specials || []).filter((s) => s.courseId && !String(s.courseId).startsWith("seed")).map((s) => `${s.courseId}#${s.vi}`);
  return `index.html${keys.length ? `?pick=${encodeURIComponent(keys.join(","))}` : ""}#apply`;
}
(async () => {
  if (!id) { paper.innerHTML = `<div class="empty" style="background:#fff">안내문 주소가 올바르지 않습니다.</div>`; return; }
  try {
    const snap = await getDoc(doc(db, "notices", id));
    if (!snap.exists()) { paper.innerHTML = `<div class="empty" style="background:#fff">안내문을 찾을 수 없습니다. 학원(02-595-1280)으로 문의해주세요.</div>`; return; }
    const n = snap.data();
    document.title = `${noticeTitle(n)} | CMS 서초영재관`;
    paper.innerHTML = renderNotice(n, { applyUrl: applyUrl(n) });
  } catch (e) {
    console.error(e);
    paper.innerHTML = `<div class="empty" style="background:#fff">안내문을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>`;
  }
})();
</script>
</body>
</html>
